{% extends "base.html" %}
{% block title %}VirtCam — Edit {{ txn.address }}{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-3">
    <a href="{{ url_for('main.transaction_detail', txn_id=txn.id) }}" class="btn btn-sm btn-outline-secondary me-3">
        <i class="bi bi-arrow-left"></i> Back
    </a>
    <h4 class="mb-0">Edit: {{ txn.address }}</h4>
</div>

<form method="POST" action="{{ url_for('main.edit_transaction', txn_id=txn.id) }}">
    {% set show_milestones = true %}
    {% include "_form_fields.html" %}

    <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-check-lg me-1"></i> Save Changes
        </button>
        <a href="{{ url_for('main.transaction_detail', txn_id=txn.id) }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
</form>
{% endblock %}

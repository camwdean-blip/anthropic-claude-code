{% extends "base.html" %}
{% block title %}VirtCam — New Transaction{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-3">
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-sm btn-outline-secondary me-3">
        <i class="bi bi-arrow-left"></i> Back
    </a>
    <h4 class="mb-0">New Transaction</h4>
</div>

<form method="POST" action="{{ url_for('main.new_transaction') }}">
    {% set show_milestones = false %}
    {% include "_form_fields.html" %}

    <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-check-lg me-1"></i> Create Transaction
        </button>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
</form>
{% endblock %}

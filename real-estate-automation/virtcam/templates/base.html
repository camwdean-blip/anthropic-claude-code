<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VirtCam{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg border-bottom">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="{{ url_for('main.dashboard') }}">
                <i class="bi bi-house-door-fill me-2" style="color: var(--brand-blue);"></i>VirtCam
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="{{ url_for('main.dashboard') }}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-grid-3x3-gap me-1"></i>Dashboard
                </a>
                <a href="{{ url_for('main.new_transaction') }}" class="btn btn-sm btn-primary">
                    <i class="bi bi-plus-lg me-1"></i>New Transaction
                </a>
            </div>
        </div>
    </nav>

    <!-- Flash Messages -->
    <div class="container-fluid px-4 mt-3">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}
    </div>

    <!-- Page Content -->
    <main class="container-fluid px-4 py-3">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

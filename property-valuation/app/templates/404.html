{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center py-5">
        <i class="bi bi-house-x display-1 text-muted"></i>
        <h1 class="mt-4">404</h1>
        <h4 class="text-muted">Page Not Found</h4>
        <p class="text-muted mt-3">
            The page you're looking for doesn't exist or has been moved.
        </p>
        <div class="mt-4">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary me-2">
                <i class="bi bi-house me-1"></i>Go Home
            </a>
            <a href="{{ url_for('main.history') }}" class="btn btn-outline-secondary">
                <i class="bi bi-clock-history me-1"></i>View History
            </a>
        </div>
    </div>
</div>
{% endblock %}

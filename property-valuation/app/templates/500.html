{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center py-5">
        <i class="bi bi-exclamation-octagon display-1 text-danger"></i>
        <h1 class="mt-4">500</h1>
        <h4 class="text-muted">Internal Server Error</h4>
        <p class="text-muted mt-3">
            Something went wrong on our end. Please try again later.
        </p>
        <div class="mt-4">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary me-2">
                <i class="bi bi-house me-1"></i>Go Home
            </a>
            <button onclick="location.reload()" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-clockwise me-1"></i>Retry
            </button>
        </div>
    </div>
</div>
{% endblock %}
